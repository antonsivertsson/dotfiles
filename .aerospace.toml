after-startup-command = ['exec-and-forget sketcybar', 'exec-and-forget borders active_color="gradient(top_left=0xffffbf00,bottom_right=0xffff7f50)" width=5.0 inactive_color=0xff494d64']

on-focus-changed = [ 'exec-and-forget sketchybar --trigger aerospace_focus_change' ]
exec-on-workspace-change = ['/bin/bash', '-c', 'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE']

# Start AeroSpace at login
start-at-login = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30

default-root-container-layout = 'tiles'

default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

automatically-unhide-macos-hidden-apps = true

# Add additional paths
[exec.env-vars]
    PATH = '/opt/homebrew/bin:/opt/homebrew/sbin:${HOME}/.local/bin:${PATH}'

[key-mapping]
    preset = 'qwerty'

[gaps]
    inner.horizontal = 8
    inner.vertical   = 8
    outer.left       = [ { monitor.main = 8 }, { monitor."LU28R55" = 200 }, 8 ]
    outer.bottom     = [ { monitor.main = 8 }, { monitor."LU28R55" = 100 }, 8 ]
    outer.top        = [ { monitor.main = 40 }, { monitor."LU28R55" = 100 }, 40 ]
    outer.right      = [ { monitor.main = 8 }, { monitor."LU28R55" = 200 }, 8 ]

    # -- Uncomment for fullscreen on all monitors --
    # outer.left       = 8
    # outer.bottom     = 8
    # outer.top        = 40
    # outer.right      = 8

[mode.main.binding]
    # See: https://nikitabobko.github.io/AeroSpace/commands#layout
    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'

    # See: https://nikitabobko.github.io/AeroSpace/commands#focus
    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    # See: https://nikitabobko.github.io/AeroSpace/commands#move
    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    # See: https://nikitabobko.github.io/AeroSpace/commands#resize
    alt-shift-comma = 'resize smart -50'
    alt-shift-period = 'resize smart +50'

    # See: https://nikitabobko.github.io/AeroSpace/commands#workspace
    alt-a = 'workspace A' # In your config, you can drop workspace bindings that you don't need
    alt-d = 'workspace D'
    alt-e = 'workspace E'
    alt-q = 'workspace Q'
    alt-s = 'workspace S'
    alt-w = 'workspace W'

    alt-m = ['move-workspace-to-monitor --workspace W secondary', 'move-workspace-to-monitor --workspace E secondary', 'move-workspace-to-monitor --workspace S secondary']
    alt-enter = 'exec-and-forget env LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8 zsh -c "typepipe_tofr"'
    alt-shift-enter = 'exec-and-forget env LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8 zsh -c "typepipe_fr"'
    alt-o = 'fullscreen'

    # See: https://nikitabobko.github.io/AeroSpace/commands#move-node-to-workspace
    alt-shift-a = 'move-node-to-workspace A'
    alt-shift-d = 'move-node-to-workspace D'
    alt-shift-e = 'move-node-to-workspace E'
    alt-shift-f = 'macos-native-fullscreen'
    alt-shift-q = 'move-node-to-workspace Q'
    alt-shift-s = 'move-node-to-workspace S'
    alt-shift-w = 'move-node-to-workspace W'

    alt-f = ['layout floating tiling', 'mode main']

    # See: https://nikitabobko.github.io/AeroSpace/commands#workspace-back-and-forth
    alt-tab = 'workspace-back-and-forth'
    # See: https://nikitabobko.github.io/AeroSpace/commands#move-workspace-to-monitor
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    # See: https://nikitabobko.github.io/AeroSpace/commands#mode
    alt-shift-semicolon = 'mode service'

# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
    backspace = ['close-all-windows-but-current', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']

    down = 'volume down'
    up = 'volume up'
    shift-down = ['volume set 0', 'mode main']

# -- Application to Workspace mappings --

# Workspace Q
[[on-window-detected]]
  if.app-id = 'com.spotify.client'
  run = 'move-node-to-workspace Q'

[[on-window-detected]]
  if.app-id = 'com.apple.Music'
  run = 'move-node-to-workspace Q'

# Workspace W
[[on-window-detected]]
  if.app-id = 'com.apple.Safari'
  run = [ 'layout accordion horizontal', 'move-node-to-workspace W' ]

[[on-window-detected]]
  if.app-id = 'app.zen-browser.zen'
  run = [ 'layout accordion horizontal', 'move-node-to-workspace W' ]

# Workspace E
[[on-window-detected]]
  if.app-id = "md.obsidian"
  run = 'move-node-to-workspace E'

# Workspace S
[[on-window-detected]]
  if.app-id = 'net.kovidgoyal.kitty'
  run = 'move-node-to-workspace S'

# Auto assign to monitors on startup
[[on-window-detected]]
  if.during-aerospace-startup = true
  run = [
  'move-workspace-to-monitor --workspace W secondary',
  'move-workspace-to-monitor --workspace E secondary',
  'move-workspace-to-monitor --workspace S secondary'
]
